<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela do Carrinho</title>
    <link rel="stylesheet" href="css/carrinho.css">
</head>
<body>
    <div class="rodape">
        <h1 class="logo">LOGO</h1>
        <img src="img/perfil.png" alt="foto-perfil.png" class="foto-perfil-icone">
        <input type="button" value="Minha conta" class="minha-conta">
        <img src="img/casa.png" alt="casa.png" class="tela-inicial-icone">
    </div>
    <div class="cabecario">
        <p>Meu Carrinho</p>
        <input type="search" placeholder="Buscar produtos" class="busca">
        <img src="img/lupa.png" alt="lupa.png" class="lupa-icone">
        <div class="ret-superior">
            <p class="texto-ret-superior">Resumo</p>
        </div>
    </div>
    <div class="produtos">
        <div class="caixa-produto">
            <input type="checkbox" class="selecao">
            <div class="img-produto">
                <p>img</p>
            </div>
            <div class="informacoes-produto">
                <p>Nome</p>
                <p class="desc">Descrição</p>
            </div>
            <div class="quantidade">
                <p class>Quantidade</p>
                <input type="number" class="qtd">
            </div>
            <p class="preco"><strong>Preço</strong></p>
        </div>
        <div class="ret-inferior">
            <input type="text" placeholder="Cupom" class="cupom">
            <div class="subtotal-total">
                <p>Subtotal</p>
                <p>Total</p>
            </div>
            <div class="subtotal-total-preco">
                <p><strong>Preço</strong></p>
                <p><strong>Preço</strong></p>
            </div>
            <input type="button" value="Finalizar pedido" class="botao">
        </div>
    </div>
    <div class="produtos">
        <div class="caixa-produto">
            <input type="checkbox" class="selecao">
            <div class="img-produto">
                <p>img</p>
            </div>
            <div class="informacoes-produto">
                <p>Nome</p>
                <p class="desc">Descrição</p>
            </div>
            <div class="quantidade">
                <p class>Quantidade</p>
                <input type="number" class="qtd">
            </div>
            <p class="preco"><strong>Preço</strong></p>
        </div>
    </div>
</body>
</html>
