<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela do Produto</title>
    <link rel="stylesheet" href="css/produto.css">
</head>
<body>
    <div class="rodape">
        <h1 class="logo">LOGO</h1>
        <input type="search" placeholder="Buscar produtos" class="busca">
    </div>
    <div class="informacoes-produto">
        <p class="img-produto">img produto</p>
        <div class="informacoes">
            <p>Nome Produto</p>
            <p>Descrição</p>
            <p class="preco"><strong>Preço</strong></p>
        </div>
    </div>
    <div class="img-pequena-comprar">
        <div class="img-produto-pequena">
            <p class="img-pequena">img</p>
            <p class="img-pequena">img</p>
            <p class="img-pequena">img</p>
        </div>
        <div class="compraroucarrinho">
            <input type="button" value="Comprar" class="comprar-carrinho">
            <p class="ou">ou</p>
            <input type="button" value="Carrinho" class="comprar-carrinho">
        </div>
    </div>
    <div class="promocional">
        <p class="texto-promocional">img promocional</p>
    </div>
</body>
</html>
